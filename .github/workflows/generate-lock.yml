name: Generate Poetry lock

on:
  push:
    branches: [ci-hardening]
    paths:
      - '.github/workflows/generate-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@v1
        with:
          version: "2.4.3"
      - run: poetry lock
      - name: Commit lockfile
        run: |
          git config user.name 'Diogo Ribeiro'
          git config user.email 'diogo_dj@hotmail.com'
          git add poetry.lock
          git commit -m 'Lock CI development environment'
          git push origin HEAD:ci-hardening
