name: Ruff safe autofix

on:
  push:
    branches: [ci-hardening]
    paths:
      - '.github/workflows/ruff-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: snok/install-poetry@v1
      - run: poetry install
      - name: Apply Ruff safe fixes
        run: poetry run ruff check src tests --fix || true
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Diogo Ribeiro'
          git config user.email 'diogo_dj@hotmail.com'
          git add src tests
          git commit -m 'Apply Ruff safe fixes'
          git push origin HEAD:ci-hardening
