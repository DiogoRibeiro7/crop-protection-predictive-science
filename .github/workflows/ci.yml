name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          version: "2.4.3"
      - name: Verify Poetry lock consistency
        run: poetry check --lock
      - run: poetry install --no-interaction
      - run: poetry run ruff check src tests
      - run: poetry run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
        with:
          version: "2.4.3"
      - run: poetry install --no-interaction
      - run: poetry run pytest --cov=crop_protection_ps --cov-report=term-missing

  container-scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked runtime image
        run: docker build --pull=false --target runtime --tag crop-protection-ps:runtime .
      - name: Run default runtime command offline
        run: docker run --rm --network none crop-protection-ps:runtime > /dev/null
      - name: Build locked scientific-test image
        run: docker build --pull=false --target scientific-test --tag crop-protection-ps:scientific-test .
      - name: Regenerate and verify all scientific conclusions offline
        run: |
          docker run --rm --network none crop-protection-ps:scientific-test sh -lc '
            crop-protection-real > /dev/null &&
            crop-protection-bipolaris > /dev/null &&
            crop-protection-bayesian > /dev/null &&
            crop-protection-environment > /dev/null &&
            crop-protection-adaptive > /dev/null &&
            crop-protection-multifidelity > /dev/null &&
            crop-protection-portfolio > /dev/null &&
            crop-protection-multiobjective > /dev/null &&
            crop-protection-model-risk > /dev/null &&
            poetry run pytest tests/test_scientific_contract.py
          '

  scientific-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@v1
        with:
          version: "2.4.3"
      - run: poetry install --no-interaction
      - run: poetry run crop-protection-real > /dev/null
      - run: poetry run crop-protection-bipolaris > /dev/null
      - run: poetry run crop-protection-bayesian > /dev/null
      - run: poetry run crop-protection-environment > /dev/null
      - run: poetry run crop-protection-adaptive > /dev/null
      - run: poetry run crop-protection-multifidelity > /dev/null
      - run: poetry run crop-protection-portfolio > /dev/null
      - run: poetry run crop-protection-multiobjective > /dev/null
      - run: poetry run crop-protection-model-risk > /dev/null
      - name: Verify regenerated scientific conclusions
        run: poetry run pytest tests/test_scientific_contract.py
      - name: Upload Bipolaris decision bundle
        uses: actions/upload-artifact@v4
        with:
          name: bipolaris-decision-bundle
          path: |
            results/bipolaris
            pyproject.toml
            poetry.lock
          if-no-files-found: error
