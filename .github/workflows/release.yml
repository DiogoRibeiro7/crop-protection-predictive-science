name: Release v1.1.0

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ff3c533cd8a23f6971b450669b59e77791b7e00
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.3"
      - name: Verify release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          with Path('pyproject.toml').open('rb') as handle:
              pyproject = tomllib.load(handle)
          assert pyproject['project']['version'] == '1.1.0'

          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          assert re.search(r'^version:\s*1\.1\.0\s*$', cff, re.MULTILINE)

          package = Path('src/crop_protection_ps/__init__.py').read_text(encoding='utf-8')
          assert '__version__ = "1.1.0"' in package
          PY
      - name: Build release artifacts
        run: |
          poetry check --lock
          poetry build
      - name: Refuse to move an existing tag
        run: |
          if git rev-parse -q --verify refs/tags/v1.1.0 >/dev/null; then
            test "$(git rev-list -n 1 v1.1.0)" = "0ff3c533cd8a23f6971b450669b59e77791b7e00"
            echo "v1.1.0 already exists at the certified commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.1.0 0ff3c533cd8a23f6971b450669b59e77791b7e00 -m "crop-protection-predictive-science v1.1.0"
            git push origin refs/tags/v1.1.0
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "GitHub release v1.1.0 already exists"
          else
            gh release create v1.1.0 dist/* \
              --title "v1.1.0" \
              --notes-file RELEASE_VALIDATION.md \
              --verify-tag
          fi
