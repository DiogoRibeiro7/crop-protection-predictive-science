name: Ruff manual hardening

on:
  push:
    branches: [ci-hardening]
    paths:
      - '.github/workflows/manual-ruff-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed Ruff fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          old = '[tool.ruff.lint]\nselect = ["E", "F", "I", "UP", "B", "SIM", "RUF"]\n'
          new = (
              '[tool.ruff.lint]\n'
              'select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]\n'
              'allowed-confusables = ["×", "−", "–"]\n'
          )
          if text.count(old) != 1:
              raise SystemExit('Unexpected Ruff configuration; refusing to patch.')
          pyproject.write_text(text.replace(old, new), encoding='utf-8')

          portfolio = Path('src/crop_protection_ps/portfolio_decision.py')
          text = portfolio.read_text(encoding='utf-8')
          old = '''        previous = dp[i - 1, k - 1, budget - cost]\n        if np.isfinite(previous) and np.isclose(dp[i, k, budget], previous + value):\n            # Require strict improvement over the state that skips the item to resolve ties\n            # deterministically in favour of the smaller portfolio.\n            if dp[i, k, budget] > dp[i - 1, k, budget] + 1e-12:\n                selected.append(i - 1)\n                k -= 1\n                budget -= cost\n'''
          new = '''        previous = dp[i - 1, k - 1, budget - cost]\n        # Require strict improvement over the state that skips the item to resolve ties\n        # deterministically in favour of the smaller portfolio.\n        if (\n            np.isfinite(previous)\n            and np.isclose(dp[i, k, budget], previous + value)\n            and dp[i, k, budget] > dp[i - 1, k, budget] + 1e-12\n        ):\n            selected.append(i - 1)\n            k -= 1\n            budget -= cost\n'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected portfolio backtracking block; refusing to patch.')
          portfolio.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit reviewed fixes
        run: |
          git config user.name 'Diogo Ribeiro'
          git config user.email 'diogo_dj@hotmail.com'
          git add pyproject.toml src/crop_protection_ps/portfolio_decision.py
          git commit -m 'Resolve remaining Ruff findings'
          git push origin HEAD:ci-hardening
